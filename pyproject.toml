[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slackwater-tempo"
version = "0.1.0"
description = "Tempo-first engine: because tempo is the first-class citizen that everything else depends on. As is life."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Casey DiGennaro", email = "casey@digennaro.com" }]
keywords = ["tempo", "midi", "groove", "clock", "slackwater", "lucineer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[tool.setuptools.packages.find]
include = ["slackwater_tempo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
